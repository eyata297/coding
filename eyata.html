<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>my favorite animal</h2> 
<label for="name">enter animal name</label>
<input type="text" id="name" placeholder="animal name" required>
<label for="describe">enter animal description</label> 
<textarea name="describe" id="describe" rows="5"></textarea>
<p>select the type of animal</p>
<select name="type" id="type">
<option value="" disabled>select</option>
<option value="rabbit">rabbit</option>
<option value="cat">cat</option>
<option value="deer">deer</option>
<option value="tiger">tiger</option>
</select>
<p>animal favorite activity</p>
<label for="eating">eating</label>
<input type="checkbox" id="eating" name="activity" value="eating">
<label for="hoping">hoping</label>
<input type="checkbox" id="hoping" name="activity" value="hoping">
<label for="sleeping">sleeping</label>
<input type="checkbox" id="sleeping" name="activity" value="sleeping">
<button>submit</button>
</body>
</html>
